[package]
name = "craft-font-store"
description = "The Craft apps' font store: the font indexes (Google Fonts, Noto, sources the user adds), exact font lookup, and verified installs into the suite's font folder."
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"
repository = "https://github.com/storytold/craft-libs"

[features]
default = []
# The pinned built-in indexes compiled in (`Index::bundled`), about 620 KB gzipped, so an app can
# look fonts up with no request at all.
bundled-index = []

[dependencies]
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
skrifa = { version = "0.47", default-features = false, features = ["std"] }
thiserror = "2"

# The store and the network are native only; the web keeps fonts elsewhere.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
craft-atomic = { git = "https://github.com/storytold/craft-libs", rev = "762a06a4c6b48b522b7d4de84a87917ef90265e6", version = "=0.1.0" }
craft-font-catalog = { git = "https://github.com/storytold/craft-libs", rev = "762a06a4c6b48b522b7d4de84a87917ef90265e6", version = "=0.1.0" }
log = "0.4"
# Language packs (`language_packs`): `<locale>.tar.zst` archives, unpacked in pure Rust.
ruzstd = { version = "0.9", default-features = false, features = ["std"] }
toml = { version = "1", default-features = false, features = ["parse", "serde", "std"] }
tar = { version = "0.4", default-features = false }
# Blocking HTTPS with rustls and webpki roots: no async runtime, no OpenSSL.
ureq = { version = "3", default-features = false, features = ["rustls", "gzip"] }

[dev-dependencies]
write-fonts = "0.54"

[lints]
workspace = true
